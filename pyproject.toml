[project]
name = "ordering-platform"
version = "0.1.0"
description = "Distributed online sales platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0,<4",
    "gunicorn>=23,<24",
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "redis>=5,<6",
    "pika>=1.3,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-redis",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "shared",
    "core-api/src",
    "customer-service/src",
    "product-service/src",
    "order-service/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "core-api/src:customer-service/src:product-service/src:order-service/src:."
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = [
    "shared",
    "core-api/src",
    "customer-service/src",
    "product-service/src",
    "order-service/src",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "core-api/tests",
    "customer-service/tests",
    "product-service/tests",
    "order-service/tests",
]
pythonpath = [
    ".",
    "core-api/src",
    "customer-service/src",
    "product-service/src",
    "order-service/src",
]
addopts = "-q"
